site_name: Security Knowledge Base
site_description: Practical cybersecurity documentation, control models, evidence, and reusable tools.
site_url: https://viksaikou.github.io/security-knowledge-base/

theme:
  name: material
  
  features:
    - navigation.tabs
  
  plugins:
  - search
  - macros
  - table-reader
  

  markdown_extensions:
  - tables

  extra_css:
  - stylesheets/extra.css

  palette:    
    - scheme: default
      primary: blue grey
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    
    - scheme: slate
      primary: blue grey
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode   


markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format


nav:
  - Home: index.md

  - ISO 27001 Control Dependency Map:
      - Overview: ISO 27001 Control Dependency Map/index.md
      - Control Dependency Map: ISO 27001 Control Dependency Map/iso-27001-control-dependency-map.md

  - Trust Boundaries:
      - Overview: trust-boundaries/index.md
      - Business Architecture: trust-boundaries/business-architecture.md
      - Trust Zones: trust-boundaries/trust-zones.md
      - Trust Boundaries: trust-boundaries/trust-boundaries.md
      - Trust Boundary Controls: trust-boundaries/trust-boundary-controls.md
      - Data Flow: trust-boundaries/data-flow.md
      - Authentication Flow: trust-boundaries/authentication-flow.md
      - Authorization Flow: trust-boundaries/authorization-flow.md
      - Attack Paths: trust-boundaries/attack-paths.md
      - Trust Recovery Paths: trust-boundaries/trust-recovery-paths.md
      - Trust Boundary Evidence: trust-boundaries/trust-boundary-evidence.md
      - Trust Boundary Failure: trust-boundaries/trust-boundary-failure.md

  - AustraKey Lab:
      - Overview: AustraKey Lab/index.md
      - Access Management:
          - Access Request Approval: AustraKey Lab/Access Management/workflow-001-access-request-approval.md
      - Getting Started:
          - Overview: AustraKey Lab/Getting Started/index.md

  - Reusable Tools & Templates:
      - Evidence Register: Reusable Tools-Templates/evidence-register.md
      - Risk Register: Reusable Tools-Templates/risk-register.md

  - About: about.md
