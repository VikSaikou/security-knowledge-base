site_name: Security Knowledge Base
site_description: Practical cybersecurity documentation, control models, evidence, and reusable tools.
site_url: https://viksaikou.github.io/security-knowledge-base/

theme:
  name: material
  
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
  
  plugins:
  - search
  - macros
  - table-reader
       
  
  markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  

  extra_css:
  - stylesheets/extra.css

  palette:    
    - scheme: default
      primary: blue grey
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    
    - scheme: slate
      primary: blue grey
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode   


markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format


nav:
  - Home: index.md

  - ISO 27001 Control Dependency Map:
      - Overview: iso-27001-control-dependency-map/index.md
      - Methodology: iso-27001-control-dependency-map/methodology.md
      - Dependency Table: iso-27001-control-dependency-map/dependency_table.md

  - Client Security Discovery Framework:
      - Overview: client-security-discovery-framework/index.md
      - Discovery Question Bank: client-security-discovery-framework/discovery-question-bank.md
      - Discovery Notes Template: client-security-discovery-framework/discovery-notes-template.md
      - Signal Classification: client-security-discovery-framework/signal-classification.md
      - Requirements Register: client-security-discovery-framework/requirements-register.md
      - Risk and Assumption Log: client-security-discovery-framework/risk-and-assumption-log.md
      - AustraKey Remote Access Example: client-security-discovery-framework/example-austrakey-remote-access.md

  - Trust Boundaries:
      - Overview: trust-boundaries/index.md
      - Business Architecture: trust-boundaries/business-architecture.md
      - Trust Zones: trust-boundaries/trust-zones.md
      - Trust Boundaries: trust-boundaries/trust-boundaries.md
      - Trust Boundary Controls: trust-boundaries/trust-boundary-controls.md
      - Data Flow: trust-boundaries/data-flow.md
      - Authentication Flow: trust-boundaries/authentication-flow.md
      - Authorization Flow: trust-boundaries/authorization-flow.md
      - Attack Paths: trust-boundaries/attack-paths.md
      - Trust Recovery Paths: trust-boundaries/trust-recovery-paths.md
      - Trust Boundary Evidence: trust-boundaries/trust-boundary-evidence.md
      - Trust Boundary Failure: trust-boundaries/trust-boundary-failure.md

  - About: about.md
